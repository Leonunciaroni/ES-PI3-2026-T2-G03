name: Auto Comment on Issue

on:
  issues:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Comentar automaticamente
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## 🧾 Atualização de Desenvolvimento

Tempo estimado de desenvolvimento:

Tempo real:

Iniciado:
Finalizado:

---

### 📝 Breves anotações:
-

---

### 🚧 Pendências / Travas:
-

---

### 🚀 Extras / Próximos Passos:
-

---
_Este comentário foi gerado automaticamente pelo workflow._'
            })