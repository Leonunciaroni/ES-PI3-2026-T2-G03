name: Column Tracker - Rastreio de Progresso

on:
  projects_v2_item:
    types: [edited]

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      issues: write
    steps:
      - name: Rastrear transição de coluna
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const payload = context.payload;
            const item = payload.projects_v2_item;

            const changedField = payload.changes?.field_value?.field_name;
            if (changedField !== 'Status') return;

            const fromStatus = payload.changes?.field_value?.before?.name ?? 'Desconhecido';
            const toStatus   = payload.changes?.field_value?.after?.name  ?? 'Desconhecido';

            console.log(`Transição: ${fromStatus} → ${toStatus}`);

            // Busca dados completos do item via GraphQL
            const query = `
              query($nodeId: ID!) {
                node(id: $nodeId) {
                  ... on ProjectV2Item {
                    content {
                      ... on Issue {
                        number
                        title
                        repository {
                          owner { login }
                          name
                        }
                      }
                    }
                    fieldValues(first: 30) {
                      nodes {
                        ... on ProjectV2ItemFieldDateValue {
                          date
                          field { ... on ProjectV2Field { name } }
                        }
                        ... on ProjectV2ItemFieldNumberValue {
                          number
                          field { ... on ProjectV2Field { name } }
                        }
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          field { ... on ProjectV2SingleSelectField { name } }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, { nodeId: item.node_id });
            const itemData = result.node;
            const content = itemData?.content;
            if (!content?.number) return;

            const issueNumber = content.number;
            const issueTitle  = content.title;
            const owner       = content.repository.owner.login;
            const repo        = content.repository.name;

            // Extrai campos do projeto
            const fields = itemData.fieldValues.nodes;
            const getDate   = name => fields.find(n => n?.field?.name === name)?.date   ?? null;
            const getNumber = name => fields.find(n => n?.field?.name === name)?.number ?? null;

            const startDate  = getDate('Start date');
            const targetDate = getDate('Target date');
            const estimate   = getNumber('Estimate');

            // Helpers de formatação
            const fmtDate = iso => iso
              ? new Date(iso + 'T00:00:00').toLocaleDateString('pt-BR')
              : '—';

            const daysBetween = (isoA, isoB) => {
              const a = new Date(isoA + (isoA.includes('T') ? '' : 'T00:00:00'));
              const b = new Date(isoB + (isoB.includes('T') ? '' : 'T00:00:00'));
              return Math.round((b - a) / (1000 * 60 * 60 * 24));
            };

            const today = new Date().toISOString().split('T')[0];

            // Busca comentários existentes para calcular tempo na coluna anterior
            const allComments = await github.rest.issues.listComments({
              owner, repo, issue_number: issueNumber, per_page: 100
            });

            // Encontra o timestamp do comentário da coluna anterior (para calcular duração)
            const trackerTag = '<!-- column-tracker -->';
            const trackerComments = allComments.data
              .filter(c => c.body.includes(trackerTag))
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            const lastTrackerComment = trackerComments.at(-1);
            const lastCommentDate = lastTrackerComment
              ? lastTrackerComment.created_at.split('T')[0]
              : today;

            const daysInPrevColumn = daysBetween(lastCommentDate, today);

            // ─────────────────────────────────────────────
            // Monta o comentário conforme a transição
            // ─────────────────────────────────────────────
            let body = '';

            // ── READY ──────────────────────────────────
            if (toStatus === 'Ready') {
              body = `<!-- column-tracker -->
## 📋 Task pronta para iniciar

| Campo | Valor |
|---|---|
| 📅 Start date prevista | ${fmtDate(startDate)} |
| 🎯 Target date | ${fmtDate(targetDate)} |
| ⏱️ Estimativa | ${estimate != null ? estimate + ' horas' : '—'} |

> Task movida para **Ready** — aguardando início do desenvolvimento.

_Rastreio automático de coluna._`;
            }

            // ── IN PROGRESS ────────────────────────────
            else if (toStatus === 'In Progress') {
              const prazoTotal = (startDate && targetDate)
                ? daysBetween(startDate, targetDate) + ' dias'
                : '—';

              body = `<!-- column-tracker -->
## 🚀 Desenvolvimento iniciado

| Campo | Valor |
|---|---|
| 🗓️ Iniciado em | ${fmtDate(today)} |
| 📅 Start date prevista | ${fmtDate(startDate)} |
| 🎯 Target date | ${fmtDate(targetDate)} |
| ⏱️ Estimativa | ${estimate != null ? estimate + ' horas' : '—'} |
| 📆 Janela total de prazo | ${prazoTotal} |
| ⏳ Tempo em **${fromStatus}** | ${daysInPrevColumn} dia(s) |

_Rastreio automático de coluna._`;
            }

            // ── IN REVIEW ──────────────────────────────
            else if (toStatus === 'In Review') {
              const isFromAdjustment = fromStatus === 'Adjustment';
              const icon = isFromAdjustment ? '🔄' : '🔍';
              const label = isFromAdjustment ? 'Retornou para Review após ajuste' : 'Enviado para Review';

              body = `<!-- column-tracker -->
## ${icon} ${label}

| Campo | Valor |
|---|---|
| 🗓️ Data | ${fmtDate(today)} |
| 🎯 Target date | ${fmtDate(targetDate)} |
| ⏳ Tempo em **${fromStatus}** | ${daysInPrevColumn} dia(s) |`;

              if (targetDate) {
                const diffToTarget = daysBetween(today, targetDate);
                if (diffToTarget >= 0) {
                  body += `\n| ✅ Dias restantes até o prazo | ${diffToTarget} dia(s) |`;
                } else {
                  body += `\n| ⚠️ Atraso acumulado até agora | ${Math.abs(diffToTarget)} dia(s) |`;
                }
              }

              body += `\n\n_Rastreio automático de coluna._`;
            }

            // ── ADJUSTMENT ─────────────────────────────
            else if (toStatus === 'Adjustment') {
              const diffToTarget = targetDate ? daysBetween(today, targetDate) : null;
              const prazoMsg = diffToTarget !== null
                ? diffToTarget >= 0
                  ? `⚠️ Ainda dentro do prazo, mas restam apenas **${diffToTarget} dia(s)**`
                  : `🔴 Já está **${Math.abs(diffToTarget)} dia(s) atrasado**`
                : '—';

              body = `<!-- column-tracker -->
## ⚠️ Voltou para Adjustment

| Campo | Valor |
|---|---|
| 🗓️ Data | ${fmtDate(today)} |
| 🎯 Target date | ${fmtDate(targetDate)} |
| ⏳ Tempo em **${fromStatus}** | ${daysInPrevColumn} dia(s) |

> ${prazoMsg}
>
> 📌 Ciclos de ajuste são o principal fator de atraso — registre abaixo o motivo.

### 📝 Motivo do ajuste:
-

_Rastreio automático de coluna._`;
            }

            // ── DONE ───────────────────────────────────
            else if (toStatus === 'Done') {
              // Reconstrói linha do tempo a partir dos comentários de tracker
              const timeline = trackerComments.map((c, i) => {
                const nextDate = trackerComments[i + 1]?.created_at ?? new Date().toISOString();
                const duration = daysBetween(
                  c.created_at.split('T')[0],
                  nextDate.split('T')[0]
                );
                // Extrai qual coluna era pelo conteúdo do comentário
                const colMatch = c.body.match(/## .+ (.+)\n|## .+\*\*(.+)\*\*/);
                return { body: c.body, duration, date: c.created_at.split('T')[0] };
              });

              // Calcula tempo por coluna parseando os comentários
              const colTimes = {};
              for (const c of trackerComments) {
                let col = '';
                if (c.body.includes('pronta para iniciar'))      col = 'Ready';
                else if (c.body.includes('Desenvolvimento iniciado')) col = 'In Progress';
                else if (c.body.includes('Review'))               col = 'In Review';
                else if (c.body.includes('Adjustment'))           col = 'Adjustment';

                if (!col) continue;
                const idx = trackerComments.indexOf(c);
                const nextDate = trackerComments[idx + 1]?.created_at ?? new Date().toISOString();
                const dur = daysBetween(c.created_at.split('T')[0], nextDate.split('T')[0]);
                colTimes[col] = (colTimes[col] ?? 0) + dur;
              }

              // Última coluna antes do Done
              const lastBeforeDone = daysInPrevColumn;
              if (fromStatus && !colTimes[fromStatus]) colTimes[fromStatus] = lastBeforeDone;

              // Coluna que mais demorou
              const maxCol = Object.entries(colTimes).sort((a, b) => b[1] - a[1])[0];

              // Análise de prazo
              let prazoAnalysis = '';
              if (targetDate) {
                const diff = daysBetween(targetDate, today);
                if (diff > 0) {
                  prazoAnalysis = `❌ **Entrega atrasada** — prazo era ${fmtDate(targetDate)}, atraso de **${diff} dia(s)**`;
                } else if (diff === 0) {
                  prazoAnalysis = `✅ **Entrega no prazo** — entregue exatamente em ${fmtDate(targetDate)}`;
                } else {
                  prazoAnalysis = `🚀 **Entrega adiantada** — ${Math.abs(diff)} dia(s) antes do prazo (${fmtDate(targetDate)})`;
                }
              }

              // Número de ciclos de ajuste
              const adjustmentCycles = trackerComments.filter(c =>
                c.body.includes('Voltou para Adjustment')
              ).length;

              // Monta tabela de tempo por coluna
              const colOrder = ['Ready', 'In Progress', 'In Review', 'Adjustment'];
              let timeTable = '';
              for (const col of colOrder) {
                if (colTimes[col] != null) {
                  const isMax = maxCol && maxCol[0] === col;
                  timeTable += `| ${isMax ? '🔴 ' : ''}**${col}** | ${colTimes[col]} dia(s) ${isMax ? '← mais tempo aqui' : ''} |\n`;
                }
              }

              // Análise do gargalo
              let bottleneckMsg = '';
              if (maxCol) {
                if (maxCol[0] === 'In Review' || maxCol[0] === 'Adjustment') {
                  bottleneckMsg = `> 🔍 O gargalo foi na etapa de **${maxCol[0]}** (${maxCol[1]} dia(s)).\n> Isso ${adjustmentCycles > 0 ? `incluiu **${adjustmentCycles} ciclo(s) de ajuste**` : 'pode indicar dificuldade na revisão'}, o que provavelmente contribuiu para o atraso.`;
                } else {
                  bottleneckMsg = `> ⏳ A etapa que mais consumiu tempo foi **${maxCol[0]}** (${maxCol[1]} dia(s)).`;
                }
              }

              body = `<!-- column-tracker -->
## 🏁 Task concluída — Relatório Final

${prazoAnalysis}

---

### ⏱️ Tempo por coluna

| Coluna | Duração |
|---|---|
${timeTable}
| 🏁 **Total** | ${Object.values(colTimes).reduce((a, b) => a + b, 0) + lastBeforeDone} dia(s) |

---

### 📊 Análise

${bottleneckMsg}
${adjustmentCycles > 0 ? `> ♻️ A task passou por **${adjustmentCycles}x** o ciclo de Adjustment → Review, impactando diretamente o prazo.` : ''}

---

| Campo | Valor |
|---|---|
| 📅 Start date prevista | ${fmtDate(startDate)} |
| 🎯 Target date | ${fmtDate(targetDate)} |
| ⏱️ Estimativa original | ${estimate != null ? estimate + ' horas' : '—'} |
| 🗓️ Entregue em | ${fmtDate(today)} |

_Rastreio automático de coluna._`;
            }

            // Nenhuma transição mapeada
            if (!body) return;

            await github.rest.issues.createComment({
              owner, repo,
              issue_number: issueNumber,
              body
            });

            console.log(`✅ Comentário adicionado na issue #${issueNumber}: ${fromStatus} → ${toStatus}`);
