name: Column Tracker - Rastreio de Progresso

on:
  projects_v2_item:
    types: [edited]

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rastrear transição de coluna
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const script = require('./.github/scripts/column-tracker.js')
            await script({ github, context, core })