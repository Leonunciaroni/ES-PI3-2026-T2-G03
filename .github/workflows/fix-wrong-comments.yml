name: Remover Comentários de Prazo Incorretos

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      issues: write
    steps:
      - name: Remover apenas comentários de prazo sem Target Date
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Busca todas as issues fechadas (cards em Done)
            let page = 1;
            let allIssues = [];
            while (true) {
              const { data } = await github.rest.issues.listForRepo({
                owner, repo,
                state: 'closed',
                per_page: 100,
                page
              });
              if (data.length === 0) break;
              allIssues = allIssues.concat(data);
              page++;
            }

            console.log(`Total de issues fechadas: ${allIssues.length}`);

            let removidos = 0;

            for (const issue of allIssues) {
              const comments = await github.rest.issues.listComments({
                owner, repo,
                issue_number: issue.number,
                per_page: 100
              });

              for (const comment of comments.data) {
                // Remove SOMENTE o comentário gerado incorretamente (sem Target Date)
                // Não toca em comentários de Review, Atualização de Desenvolvimento, etc.
                const isWrongPrazoComment =
                  comment.body.includes('Gerado automaticamente pelo workflow de prazo') &&
                  comment.body.includes('Nenhuma **Target Date** foi definida');

                if (isWrongPrazoComment) {
                  await github.rest.issues.deleteComment({
                    owner, repo,
                    comment_id: comment.id
                  });
                  console.log(`  → Removido comentário incorreto da issue #${issue.number}`);
                  removidos++;
                  await new Promise(r => setTimeout(r, 300));
                }
              }
            }

            console.log(`\nTotal removido: ${removidos} comentário(s)`);
