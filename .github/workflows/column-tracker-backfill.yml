name: Column Tracker - Backfill

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      issues: write
    steps:
      - name: Processar todos os cards do board
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner         = context.repo.owner;
            const projectNumber = 2;

            // ── Helpers ──────────────────────────────────────────
            const fmtDate = iso => iso
              ? new Date(iso + 'T00:00:00').toLocaleDateString('pt-BR')
              : '—';

            const daysBetween = (isoA, isoB) => {
              const a = new Date(isoA.includes('T') ? isoA : isoA + 'T00:00:00');
              const b = new Date(isoB.includes('T') ? isoB : isoB + 'T00:00:00');
              return Math.round((b - a) / (1000 * 60 * 60 * 24));
            };

            const today = new Date().toISOString().split('T')[0];

            // ── Busca todos os itens do projeto ──────────────────
            const query = `
              query($owner: String!, $number: Int!, $cursor: String) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    items(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number
                            title
                            closedAt
                            repository {
                              owner { login }
                              name
                            }
                          }
                        }
                        fieldValues(first: 30) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field { ... on ProjectV2SingleSelectField { name } }
                            }
                            ... on ProjectV2ItemFieldDateValue {
                              date
                              field { ... on ProjectV2Field { name } }
                            }
                            ... on ProjectV2ItemFieldNumberValue {
                              number
                              field { ... on ProjectV2Field { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let allItems = [];
            let cursor   = null;
            while (true) {
              const result = await github.graphql(query, { owner, number: projectNumber, cursor });
              const page   = result.user.projectV2.items;
              allItems     = allItems.concat(page.nodes);
              if (!page.pageInfo.hasNextPage) break;
              cursor = page.pageInfo.endCursor;
            }

            console.log(`Total de itens encontrados: ${allItems.length}`);

            for (const item of allItems) {
              const content = item.content;
              if (!content?.number) continue;

              const issueNumber = content.number;
              const issueTitle  = content.title;
              const repoOwner   = content.repository.owner.login;
              const repo        = content.repository.name;

              // Campos do projeto
              const fields     = item.fieldValues.nodes;
              const getDate    = n => fields.find(f => f?.field?.name === n)?.date   ?? null;
              const getNumber  = n => fields.find(f => f?.field?.name === n)?.number ?? null;
              const getSelect  = n => fields.find(f => f?.field?.name === n)?.name   ?? null;

              const status     = getSelect('Status');
              const startDate  = getDate('Start date');
              const targetDate = getDate('Target date');
              const estimate   = getNumber('Estimate');

              // Pula cards sem status mapeado ou em Backlog (ainda não iniciados)
              if (!status || status === 'Backlog') continue;

              // Não duplica: pula se já tiver comentário de tracker
              const { data: comments } = await github.rest.issues.listComments({
                owner: repoOwner, repo,
                issue_number: issueNumber,
                per_page: 100
              });
              const jaTemTracker = comments.some(c => c.body.includes('<!-- column-tracker -->'));
              if (jaTemTracker) {
                console.log(`  → #${issueNumber} já tem tracker, pulando.`);
                continue;
              }

              let body = '';

              // ── DONE ────────────────────────────────────────────
              if (status === 'Done') {
                const closedAt = content.closedAt
                  ? content.closedAt.split('T')[0]
                  : today;

                let prazoAnalysis = '';
                if (targetDate) {
                  const diff = daysBetween(targetDate, closedAt);
                  if (diff > 0) {
                    prazoAnalysis = `❌ **Entrega atrasada** — prazo era ${fmtDate(targetDate)}, atraso de **${diff} dia(s)**`;
                  } else if (diff === 0) {
                    prazoAnalysis = `✅ **Entrega no prazo** — entregue exatamente em ${fmtDate(targetDate)}`;
                  } else {
                    prazoAnalysis = `🚀 **Entrega adiantada** — ${Math.abs(diff)} dia(s) antes do prazo (${fmtDate(targetDate)})`;
                  }
                } else {
                  prazoAnalysis = `⚠️ Nenhuma **Target date** definida — não foi possível calcular o prazo.`;
                }

                let prazoTotalDias = '—';
                if (startDate && targetDate) {
                  prazoTotalDias = daysBetween(startDate, targetDate) + ' dia(s)';
                }

                let tempoRealDias = '—';
                if (startDate) {
                  tempoRealDias = daysBetween(startDate, closedAt) + ' dia(s)';
                }

                body = `<!-- column-tracker -->
## 🏁 Task concluída — Relatório Final *(backfill)*

${prazoAnalysis}

---

### 📊 Resumo de prazo

| Campo | Valor |
|---|---|
| 📅 Start date prevista | ${fmtDate(startDate)} |
| 🎯 Target date | ${fmtDate(targetDate)} |
| ⏱️ Estimativa original | ${estimate != null ? estimate + ' horas' : '—'} |
| 🗓️ Fechada em | ${fmtDate(closedAt)} |
| 📆 Janela de prazo | ${prazoTotalDias} |
| ⏳ Tempo real (start → close) | ${tempoRealDias} |

---

> ℹ️ Este relatório foi gerado retroativamente via backfill.
> O tempo por coluna não está disponível pois as transições ocorreram antes do tracker ser instalado.

_Rastreio automático de coluna._`;
              }

              // ── IN PROGRESS ─────────────────────────────────────
              else if (status === 'In Progress') {
                const diasDesdeStart = startDate ? daysBetween(startDate, today) : null;
                const diasAteTarget  = targetDate ? daysBetween(today, targetDate) : null;

                let prazoMsg = '';
                if (diasAteTarget !== null) {
                  if (diasAteTarget > 0) {
                    prazoMsg = `✅ Ainda dentro do prazo — **${diasAteTarget} dia(s)** restantes`;
                  } else if (diasAteTarget === 0) {
                    prazoMsg = `⚠️ **Prazo é hoje!** Entregue até o fim do dia.`;
                  } else {
                    prazoMsg = `🔴 Já está **${Math.abs(diasAteTarget)} dia(s) atrasado** em relação ao Target date`;
                  }
                }

                body = `<!-- column-tracker -->
## 🚀 Em Desenvolvimento — Snapshot atual *(backfill)*

| Campo | Valor |
|---|---|
| 🗓️ Snapshot em | ${fmtDate(today)} |
| 📅 Start date prevista | ${fmtDate(startDate)} |
| 🎯 Target date | ${fmtDate(targetDate)} |
| ⏱️ Estimativa | ${estimate != null ? estimate + ' horas' : '—'} |
| ⏳ Dias desde o start | ${diasDesdeStart != null ? diasDesdeStart + ' dia(s)' : '—'} |

${prazoMsg ? `> ${prazoMsg}` : ''}

_Rastreio automático de coluna._`;
              }

              // ── IN REVIEW ────────────────────────────────────────
              else if (status === 'In Review') {
                const diasAteTarget = targetDate ? daysBetween(today, targetDate) : null;

                let prazoMsg = '';
                if (diasAteTarget !== null) {
                  if (diasAteTarget > 0) {
                    prazoMsg = `✅ Ainda dentro do prazo — **${diasAteTarget} dia(s)** restantes para o target`;
                  } else if (diasAteTarget === 0) {
                    prazoMsg = `⚠️ **Prazo é hoje!** Review precisa ser concluída agora.`;
                  } else {
                    prazoMsg = `🔴 Já está **${Math.abs(diasAteTarget)} dia(s) atrasado** — review urgente!`;
                  }
                }

                body = `<!-- column-tracker -->
## 🔍 Em Review — Snapshot atual *(backfill)*

| Campo | Valor |
|---|---|
| 🗓️ Snapshot em | ${fmtDate(today)} |
| 📅 Start date prevista | ${fmtDate(startDate)} |
| 🎯 Target date | ${fmtDate(targetDate)} |
| ⏱️ Estimativa | ${estimate != null ? estimate + ' horas' : '—'} |

${prazoMsg ? `> ${prazoMsg}` : ''}

_Rastreio automático de coluna._`;
              }

              // ── ADJUSTMENT ───────────────────────────────────────
              else if (status === 'Adjustment') {
                const diasAteTarget = targetDate ? daysBetween(today, targetDate) : null;

                let prazoMsg = '';
                if (diasAteTarget !== null) {
                  if (diasAteTarget > 0) {
                    prazoMsg = `⚠️ Ainda dentro do prazo, mas restam apenas **${diasAteTarget} dia(s)** — ajuste com urgência`;
                  } else if (diasAteTarget === 0) {
                    prazoMsg = `🔴 **Prazo é hoje!** Ajuste e entrega precisam acontecer agora.`;
                  } else {
                    prazoMsg = `🔴 Já está **${Math.abs(diasAteTarget)} dia(s) atrasado** — ciclo de ajuste impactou o prazo`;
                  }
                }

                body = `<!-- column-tracker -->
## ⚠️ Em Adjustment — Snapshot atual *(backfill)*

| Campo | Valor |
|---|---|
| 🗓️ Snapshot em | ${fmtDate(today)} |
| 📅 Start date prevista | ${fmtDate(startDate)} |
| 🎯 Target date | ${fmtDate(targetDate)} |
| ⏱️ Estimativa | ${estimate != null ? estimate + ' horas' : '—'} |

${prazoMsg ? `> ${prazoMsg}` : ''}

### 📝 Motivo do ajuste:
-

_Rastreio automático de coluna._`;
              }

              // ── READY ─────────────────────────────────────────────
              else if (status === 'Ready') {
                body = `<!-- column-tracker -->
## 📋 Pronta para iniciar — Snapshot atual *(backfill)*

| Campo | Valor |
|---|---|
| 🗓️ Snapshot em | ${fmtDate(today)} |
| 📅 Start date prevista | ${fmtDate(startDate)} |
| 🎯 Target date | ${fmtDate(targetDate)} |
| ⏱️ Estimativa | ${estimate != null ? estimate + ' horas' : '—'} |

> Task aguardando início do desenvolvimento.

_Rastreio automático de coluna._`;
              }

              if (!body) continue;

              await github.rest.issues.createComment({
                owner: repoOwner, repo,
                issue_number: issueNumber,
                body
              });

              console.log(`✅ #${issueNumber} [${status}] — comentário adicionado`);
              await new Promise(r => setTimeout(r, 500));
            }
