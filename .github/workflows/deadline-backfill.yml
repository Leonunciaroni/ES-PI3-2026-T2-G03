name: Backfill Prazo - Cards já em Done

on:
  push:
    branches:
      - main        # dispara uma vez quando o arquivo chega no repo
    paths:
      - '.github/workflows/deadline-backfill.yml'
  workflow_dispatch:  # também disponível para rodar manualmente depois
    inputs:
      project_number:
        description: 'Número do seu GitHub Project (ex: 1, 2, 3...)'
        required: true
        default: '2'
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Processar cards em Done
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = context.repo.owner;

            // Usa o input manual se disponível, senão usa o padrão '1'
            const projectNumber = parseInt(
              context.payload?.inputs?.project_number ?? '1'
            );

            const query = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number
                            repository {
                              owner { login }
                              name
                            }
                          }
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field { ... on ProjectV2SingleSelectField { name } }
                            }
                            ... on ProjectV2ItemFieldDateValue {
                              date
                              field { ... on ProjectV2Field { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, { owner, number: projectNumber });
            const items = result.user?.projectV2?.items?.nodes ?? [];

            console.log(`Total de itens encontrados: ${items.length}`);

            for (const item of items) {
              const content = item.content;
              if (!content?.number) continue;

              // Só processa cards em Done
              const statusField = item.fieldValues.nodes.find(
                n => n?.field?.name === 'Status' && n?.name
              );
              if (statusField?.name !== 'Done') continue;

              const issueNumber = content.number;
              const repoOwner = content.repository.owner.login;
              const repo = content.repository.name;

              console.log(`Processando issue #${issueNumber} (${repo})`);

              // Não duplica: pula se já tiver comentário de prazo
              const comments = await github.rest.issues.listComments({
                owner: repoOwner, repo, issue_number: issueNumber
              });
              const jaComentou = comments.data.some(c =>
                c.body.includes('Gerado automaticamente pelo workflow de prazo')
              );
              if (jaComentou) {
                console.log(`  → Já tem comentário, pulando.`);
                continue;
              }

              // Extrai Target Date
              const dateField = item.fieldValues.nodes.find(
                n => n?.field?.name === 'Target Date'
              );

              if (!dateField?.date) {
                await github.rest.issues.createComment({
                  owner: repoOwner, repo,
                  issue_number: issueNumber,
                  body: [
                    '## ✅ Task concluída!',
                    '',
                    '> ⚠️ Nenhuma **Target Date** foi definida. Não foi possível calcular o prazo.',
                    '',
                    '_Gerado automaticamente pelo workflow de prazo._'
                  ].join('\n')
                });
                continue;
              }

              // Usa a data de fechamento da issue como referência (backfill histórico)
              const issueData = await github.rest.issues.get({
                owner: repoOwner, repo, issue_number: issueNumber
              });

              const closedAt = issueData.data.closed_at
                ? new Date(issueData.data.closed_at)
                : new Date();
              closedAt.setHours(0, 0, 0, 0);

              const target = new Date(dateField.date + 'T00:00:00');
              target.setHours(0, 0, 0, 0);

              const diffDays = Math.round((closedAt - target) / (1000 * 60 * 60 * 24));
              const targetFormatted = target.toLocaleDateString('pt-BR');
              const closedFormatted = closedAt.toLocaleDateString('pt-BR');

              let body;
              if (diffDays > 0) {
                body = [
                  '## ⚠️ Entrega com atraso!',
                  '',
                  `- 📅 **Prazo era:** ${targetFormatted}`,
                  `- 🗓️ **Entregue em:** ${closedFormatted}`,
                  `- ❌ **Atraso:** ${diffDays} dia(s)`,
                  '',
                  '_Gerado automaticamente pelo workflow de prazo._'
                ].join('\n');
              } else if (diffDays === 0) {
                body = [
                  '## ✅ Entrega no prazo!',
                  '',
                  `- 📅 **Prazo era:** ${targetFormatted}`,
                  `- 🗓️ **Entregue em:** ${closedFormatted}`,
                  '- ✅ Task entregue exatamente no prazo!',
                  '',
                  '_Gerado automaticamente pelo workflow de prazo._'
                ].join('\n');
              } else {
                const adiantado = Math.abs(diffDays);
                body = [
                  '## 🚀 Entrega adiantada!',
                  '',
                  `- 📅 **Prazo era:** ${targetFormatted}`,
                  `- 🗓️ **Entregue em:** ${closedFormatted}`,
                  `- ⏩ **Adiantado:** ${adiantado} dia(s)`,
                  '',
                  '_Gerado automaticamente pelo workflow de prazo._'
                ].join('\n');
              }

              await github.rest.issues.createComment({
                owner: repoOwner, repo,
                issue_number: issueNumber,
                body
              });

              console.log(`  → Comentário adicionado: ${diffDays > 0 ? 'ATRASADO' : diffDays === 0 ? 'NO PRAZO' : 'ADIANTADO'}`);

              // Pequeno delay para não estourar o rate limit da API
              await new Promise(r => setTimeout(r, 600));
            }
